[package]
name = "security-monitor-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Security Monitor desktop application shell"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
security-monitor-advisory-providers = { version = "0.1.0", path = "../../../crates/advisory-providers" }
security-monitor-ai = { version = "0.1.0", path = "../../../crates/ai" }
security-monitor-agent-protocol = { version = "0.1.0", path = "../../../crates/agent-protocol" }
security-monitor-agent-transport = { version = "0.1.0", path = "../../../crates/agent-transport" }
security-monitor-app-services = { version = "0.1.0", path = "../../../crates/app-services" }
chrono.workspace = true
security-monitor-correlation = { version = "0.1.0", path = "../../../crates/correlation" }
security-monitor-core = { version = "0.1.0", path = "../../../crates/core" }
security-monitor-database = { version = "0.1.0", path = "../../../crates/database" }
security-monitor-drift = { version = "0.1.0", path = "../../../crates/drift" }
security-monitor-inventory = { version = "0.1.0", path = "../../../crates/inventory" }
security-monitor-mcp-server = { version = "0.1.0", path = "../../../crates/mcp-server" }
security-monitor-remediation = { version = "0.1.0", path = "../../../crates/remediation" }
security-monitor-scan-orchestrator = { version = "0.1.0", path = "../../../crates/scan-orchestrator" }
security-monitor-scanner-adapters = { version = "0.1.0", path = "../../../crates/scanner-adapters" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
uuid.workspace = true
url.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-updater = { version = "=2.13.1", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = { version = "=2.13.1", default-features = false, features = ["rustls-tls", "system-proxy", "zip"] }

[dev-dependencies]
tempfile = "3"
