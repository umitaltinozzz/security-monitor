[advisories]
unmaintained = "workspace"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
]
exceptions = [
    { crate = "cssparser@0.37.0", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros@0.7.1", allow = ["MPL-2.0"] },
    { crate = "dtoa-short@0.3.5", allow = ["MPL-2.0"] },
    { crate = "foldhash@0.1.5", allow = ["Zlib"] },
    { crate = "foldhash@0.2.0", allow = ["Zlib"] },
    { crate = "inotify@0.11.5", allow = ["ISC"] },
    { crate = "inotify-sys@0.1.8", allow = ["ISC"] },
    { crate = "notify@8.2.0", allow = ["CC0-1.0"] },
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
    { crate = "quoted_printable@0.5.2", allow = ["0BSD"] },
    { crate = "ring@0.17.14", allow = ["Apache-2.0", "ISC"] },
    { crate = "rustls-webpki@0.103.16", allow = ["ISC"] },
    { crate = "selectors@0.38.0", allow = ["MPL-2.0"] },
    { crate = "smartstring@1.0.1", allow = ["MPL-2.0"] },
    { crate = "target-lexicon@0.12.16", allow = ["Apache-2.0 WITH LLVM-exception"] },
    { crate = "untrusted@0.9.0", allow = ["ISC"] },
    { crate = "version-ranges@0.1.3", allow = ["MPL-2.0"] },
    { crate = "webpki-roots@1.0.11", allow = ["CDLA-Permissive-2.0"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
