[workspace]
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "crates/core",
    "crates/database",
    "crates/inventory",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
cargo-lock = "11.1"
clap = { version = "4.5", features = ["derive"] }
gomod-parser = "0.6"
pep508_rs = "0.9.2"
purl = "0.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"
ts-rs = { version = "11", features = ["chrono-impl", "serde-compat"] }
url = "2"
yarn-lock-parser = "0.14"
