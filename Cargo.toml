[workspace]
members = [
    "apps/cli",
    "apps/desktop/src-tauri",
    "crates/core",
    "crates/database",
    "crates/inventory",
    "crates/advisory-providers",
    "crates/scanner-adapters",
    "crates/correlation",
    "crates/drift",
    "crates/scan-orchestrator",
    "crates/notify",
    "crates/agent-protocol",
    "crates/agent-transport",
    "agents/linux",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
httpdate = "1"
hex = "0.4"
async-trait = "0.1"
cargo-lock = "11.1"
clap = { version = "4.5", features = ["derive"] }
gomod-parser = "0.6"
pep508_rs = "0.9.2"
purl = "0.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_yaml_ng = "0.10"
schemars = { version = "1.2.3", features = ["chrono04"] }
russh = { version = "0.64.1", default-features = false, features = ["ring"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
ts-rs = { version = "11", features = ["chrono-impl", "serde-compat"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
yarn-lock-parser = "0.14"
tracing = "0.1"
