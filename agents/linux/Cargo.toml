[package]
name = "secmon-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read-only Linux inventory agent for Security Monitor"

[dependencies]
chrono = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
security-monitor-agent-protocol = { version = "0.1.0", path = "../../crates/agent-protocol" }
security-monitor-inventory = { version = "0.1.0", path = "../../crates/inventory" }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[[bin]]
name = "secmon-agent"
path = "src/main.rs"

[lib]
name = "secmon_agent"
path = "src/lib.rs"
