name: Signed release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic version tag to build (leave empty for a dry run of the selected branch)
        required: false
        type: string
      dry_run:
        description: Build, sign, and verify every artifact without publishing a GitHub release
        required: true
        default: true
        type: boolean

# Read-only by default; only the publish job is granted write access to create the release.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    environment: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            platform: windows
            arch: x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            platform: darwin
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
            platform: darwin
            arch: aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            platform: linux
            arch: x86_64
    env:
      SECMON_UPDATE_PUBLIC_KEY: ${{ vars.SECMON_UPDATE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      SECMON_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.SECMON_WINDOWS_CERTIFICATE_THUMBPRINT }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.27.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          target: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Verify release signing configuration
        id: signing
        run: node scripts/release/verify-config.mjs ${{ matrix.platform }}

      - name: Install minisign on Windows
        if: runner.os == 'Windows'
        run: choco install minisign --yes --no-progress

      - name: Install minisign on macOS
        if: runner.os == 'macOS'
        run: brew install minisign

      - name: Install minisign on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y minisign

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && steps.signing.outputs.code_signing == 'signed'
        shell: pwsh
        run: |
          $certificateDirectory = Join-Path $env:RUNNER_TEMP 'security-monitor-signing'
          New-Item -ItemType Directory -Force -Path $certificateDirectory | Out-Null
          $certificateText = Join-Path $certificateDirectory 'certificate.txt'
          $certificatePath = Join-Path $certificateDirectory 'certificate.pfx'
          Set-Content -LiteralPath $certificateText -Value $env:WINDOWS_CERTIFICATE -NoNewline
          certutil -decode $certificateText $certificatePath | Out-Null
          Remove-Item -LiteralPath $certificateText -Force
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText) | Out-Null
          Remove-Item -LiteralPath $certificateDirectory -Recurse -Force

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && steps.signing.outputs.code_signing == 'signed'
        shell: bash
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/security-monitor.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/security-monitor.keychain"
          security default-keychain -s "$RUNNER_TEMP/security-monitor.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/security-monitor.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/security-monitor.keychain"
          security import "$RUNNER_TEMP/security-monitor.p12" -k "$RUNNER_TEMP/security-monitor.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/security-monitor.keychain"
          rm -f "$RUNNER_TEMP/security-monitor.p12"
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/security-monitor-notary.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/security-monitor-notary.p8" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: cargo build -p secmon --release --target ${{ matrix.target }}

      - name: Add the Linux musl targets
        if: matrix.platform == 'linux'
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Set up Zig for the Linux ARM64 agent
        if: matrix.platform == 'linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: matrix.platform == 'linux'
        run: cargo install --locked cargo-zigbuild --version 0.23.4

      - name: Build static Linux x86_64 server agent
        if: matrix.platform == 'linux'
        run: cargo build -p secmon-agent --release --target x86_64-unknown-linux-musl
        env:
          RUSTFLAGS: -C relocation-model=static

      - name: Cross-build static Linux aarch64 server agent
        if: matrix.platform == 'linux'
        run: cargo zigbuild -p secmon-agent --release --target aarch64-unknown-linux-musl
        env:
          CARGO_BUILD_WARNINGS: warn
          RUSTFLAGS: -D warnings -A linker_messages -C relocation-model=static

      - name: Verify static Linux server agents
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          for binary in \
            target/x86_64-unknown-linux-musl/release/secmon-agent \
            target/aarch64-unknown-linux-musl/release/secmon-agent; do
            file_output=$(file "$binary")
            printf '%s\n' "$file_output"
            if [[ "$file_output" != *"statically linked"* ]]; then
              printf 'Expected a statically linked agent: %s\n' "$binary" >&2
              exit 1
            fi
          done

      - name: Write Windows signing overlay
        if: runner.os == 'Windows' && steps.signing.outputs.code_signing == 'signed'
        run: node scripts/release/write-tauri-config.mjs windows target/tauri.release.json

      - name: Build signed desktop packages
        if: runner.os == 'Windows' && steps.signing.outputs.code_signing == 'signed'
        run: pnpm -C apps/desktop tauri build --target ${{ matrix.target }} --config ../../target/tauri.release.json

      - name: Build unsigned Windows desktop packages
        if: runner.os == 'Windows' && steps.signing.outputs.code_signing == 'unsigned'
        run: pnpm -C apps/desktop tauri build --target ${{ matrix.target }}

      - name: Build desktop packages
        if: runner.os != 'Windows'
        shell: bash
        env:
          CODE_SIGNING: ${{ steps.signing.outputs.code_signing }}
        run: |
          if [ "$CODE_SIGNING" = unsigned ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
              APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT APPLE_API_KEY_PATH
            # Ad-hoc signing keeps Apple Silicon bundles launchable; it is not a Developer ID signature.
            export APPLE_SIGNING_IDENTITY=-
          fi
          pnpm -C apps/desktop tauri build --target ${{ matrix.target }}

      - name: Stage release files
        env:
          SECMON_CODE_SIGNING: ${{ steps.signing.outputs.code_signing }}
        run: node scripts/release/stage-assets.mjs ${{ matrix.target }} ${{ matrix.artifact }} ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Sign and verify CLI and agent binaries
        run: node scripts/release/sign-binaries.mjs target/release-out/${{ matrix.artifact }}

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          path: target/release-out/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: ${{ inputs.dry_run && 'Verify release (dry run)' || 'Publish signed release' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download platform release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: target/release-assets

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$DRY_RUN" = true ]; then
            tag="v$(node -p "require('./apps/desktop/package.json').version")"
          else
            tag="$GITHUB_REF_NAME"
          fi
          printf 'value=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Create signed updater manifest and checksums
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: node scripts/release/create-manifest.mjs target/release-assets "$RELEASE_TAG"

      - name: Sign and verify release checksums
        run: node scripts/release/sign-binaries.mjs target/release-assets --checksums

      - name: Upload dry-run release files
        if: inputs.dry_run == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: target/release-assets
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: node scripts/release/publish.mjs target/release-assets "$RELEASE_TAG"
