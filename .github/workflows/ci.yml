name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: Set up Windows Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 14GB
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/cargo-home
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/cargo-target

      - name: Set Windows Cargo target directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:CARGO_TARGET_DIR 'test-temp'
          New-Item -ItemType Directory -Force -Path $env:CARGO_HOME, $env:CARGO_TARGET_DIR, $testTemp | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$testTemp"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$testTemp"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          cache: false

      - name: Cache Rust build artifacts
        if: runner.os != 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: security-monitor-${{ runner.os }}

      - name: Cache Windows Rust build artifacts
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: security-monitor-Windows-devdrive-v2
          cache-targets: false
          cache-directories: ${{ env.CARGO_TARGET_DIR }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev musl-tools

      - name: Add the Linux musl target
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl

      - name: Check the Linux installer syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh

      - name: Build the static Linux agent
        if: runner.os == 'Linux'
        run: cargo build -p secmon-agent --target x86_64-unknown-linux-musl --release

      - name: Build the OpenSSH E2E container
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/openssh-e2e
          cp tests/openssh/Dockerfile target/openssh-e2e/Dockerfile
          cp tests/openssh/sshd_config target/openssh-e2e/sshd_config
          cp target/x86_64-unknown-linux-musl/release/secmon-agent target/openssh-e2e/secmon-agent
          docker build --tag security-monitor-openssh-e2e:${{ github.sha }} target/openssh-e2e
          echo "SECMON_OPENSSH_E2E_IMAGE=security-monitor-openssh-e2e:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-deny@0.20.2

      - name: Check Rust dependency policies
        run: cargo deny check

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint desktop
        run: pnpm -C apps/desktop lint

      - name: Typecheck desktop
        run: pnpm -C apps/desktop typecheck

      - name: Test desktop
        run: pnpm -C apps/desktop test

      - name: Build desktop frontend
        run: pnpm -C apps/desktop build

      - name: Install Playwright browser
        run: pnpm -C apps/desktop exec playwright install chromium

      - name: Run desktop smoke test
        run: pnpm -C apps/desktop e2e

      - name: Build Tauri shell (debug)
        if: github.event_name != 'push'
        run: pnpm -C apps/desktop tauri build --debug --no-bundle

      - name: Build Tauri shell (release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm -C apps/desktop tauri build --no-bundle
