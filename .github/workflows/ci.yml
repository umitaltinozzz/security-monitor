name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      - name: Check Rust dependency policies
        run: cargo deny check

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint desktop
        run: pnpm -C apps/desktop lint

      - name: Typecheck desktop
        run: pnpm -C apps/desktop typecheck

      - name: Test desktop
        run: pnpm -C apps/desktop test

      - name: Build desktop frontend
        run: pnpm -C apps/desktop build

      - name: Install Playwright browser
        run: pnpm -C apps/desktop exec playwright install chromium

      - name: Run desktop smoke test
        run: pnpm -C apps/desktop e2e

      - name: Build Tauri shell
        run: pnpm -C apps/desktop tauri build --no-bundle

  dependency-policy:
    name: Cargo dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check Rust dependency policies
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          rust-version: stable
