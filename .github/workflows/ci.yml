name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          cache: false

      - name: Set up Windows Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 10GB
          mount-path: .dev-drive
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/cargo-home

      - name: Set Windows Cargo target directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE\.dev-drive\cargo-target" >> $env:GITHUB_ENV

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: security-monitor-${{ runner.os }}
          workspaces: . -> ${{ runner.os == 'Windows' && '.dev-drive/cargo-target' || 'target' }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-deny@0.20.2

      - name: Check Rust dependency policies
        run: cargo deny check

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation site
        run: pnpm -C docs/site build

      - name: Lint desktop
        run: pnpm -C apps/desktop lint

      - name: Typecheck desktop
        run: pnpm -C apps/desktop typecheck

      - name: Test desktop
        run: pnpm -C apps/desktop test

      - name: Build desktop frontend
        run: pnpm -C apps/desktop build

      - name: Install Playwright browser
        run: pnpm -C apps/desktop exec playwright install chromium

      - name: Run desktop smoke test
        run: pnpm -C apps/desktop e2e

      - name: Build Tauri shell (debug)
        if: github.event_name != 'push'
        run: pnpm -C apps/desktop tauri build --debug --no-bundle

      - name: Build Tauri shell (release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm -C apps/desktop tauri build --no-bundle
