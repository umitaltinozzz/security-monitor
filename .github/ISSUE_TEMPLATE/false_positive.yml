name: False positive or incorrect advisory match
description: Report an incorrect dependency or deployment finding.
title: "false-positive: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic or redacted package data. Do not upload a lockfile or private inventory. This project is still under development."
  - type: input
    id: advisory
    attributes:
      label: Advisory ID and source
      placeholder: CVE, GHSA, or OSV identifier
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package and version
      description: Provide the minimum details needed; redact private package names.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is the match incorrect?
      description: Include a source link or rationale if available.
    validations:
      required: true
  - type: input
    id: secmon_version
    attributes:
      label: Security Monitor version or commit
    validations:
      required: true
