name: Bug report
description: Report a reproducible problem in Security Monitor.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private source code, lockfiles, or production inventory. Report security vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic or redacted data only.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove usernames, paths, tokens, hostnames, and other identifying data.
    validations:
      required: false
